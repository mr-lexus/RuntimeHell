packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - electron
  - electron-winstaller
  - esbuild-register

# Local dev tool building its own bundled engines/runtimes: allow trusted build scripts
dangerouslyAllowAllBuilds: true

# Don't auto-run install before every package script (fails CI-less runs on warnings)
verifyDepsBeforeRun: false


allowBuilds:
  esbuild: set this to true or false
