packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  esbuild-register: true

# Don't auto-run install before every package script (fails CI-less runs on warnings)
verifyDepsBeforeRun: false

overrides:
  'brace-expansion@<2': 1.1.21
  'brace-expansion@>=2 <3': 2.1.7
  'brace-expansion@>=4': 5.0.12
  dompurify: ^3.4.17
  fast-uri: 3.1.9
  http-cache-semantics: 4.3.0
  'minimatch@>=7 <11': 11.0.9
  'undici@>=6 <7': 6.29.1
  'undici@>=7': 7.30.2
