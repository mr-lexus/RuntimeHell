name: Product website
on:
  push:
    branches: [master]
    paths: ['website/**', 'package.json', 'logo.svg', 'scripts/test-website.mjs', 'scripts/website-preview.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build
      - run: xvfb-run -a pnpm site:test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
      - uses: actions/deploy-pages@v5
        id: deployment
