name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and prerelease tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_NOTHING: '1'
      - name: Validate prerelease version/tag
        run: pnpm release:validate "${GITHUB_REF_NAME}"
      - name: Peer dependencies and vulnerability audit
        run: pnpm deps:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck:all
      - name: Unit tests
        run: xvfb-run -a pnpm test --maxWorkers=4

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: win
            arch: x64
            smoke: node scripts/e2e-compatibility.mjs
          - name: linux-x64
            os: ubuntu-latest
            target: linux
            arch: x64
            smoke: xvfb-run -a node scripts/e2e-compatibility.mjs
          - name: macos-x64
            os: macos-15-intel
            target: mac
            arch: x64
            smoke: node scripts/e2e-compatibility.mjs
          - name: macos-arm64
            os: macos-14
            target: mac
            arch: arm64
            smoke: node scripts/e2e-compatibility.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_NOTHING: '1'
      - name: Build application
        run: pnpm build
      - name: Native compatibility smoke
        run: ${{ matrix.smoke }}
      - name: Package installer
        run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtimehell-${{ matrix.name }}
          path: |
            dist-release/*.exe
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: runtimehell-*
          path: release-assets
          merge-multiple: false
      - name: Create draft, upload installers, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.exe' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.zip' -o \
              -name '*.blockmap' \
            \) -print0
          )
          if ((${#assets[@]} == 0)); then
            echo 'No platform artifacts were downloaded' >&2
            exit 1
          fi
          # Auto-update is not wired. Do not publish colliding per-arch channel YAMLs.
          declare -A filenames=()
          for asset in "${assets[@]}"; do
            filename=$(basename "$asset")
            if [[ -n "${filenames[$filename]:-}" ]]; then
              echo "Duplicate release asset: $filename" >&2
              exit 1
            fi
            filenames[$filename]=1
          done
          for platform in win-x64.exe linux-x86_64.AppImage linux-amd64.deb mac-x64.dmg mac-x64.zip mac-arm64.dmg mac-arm64.zip; do
            filename="RuntimeHell-${TAG#v}-$platform"
            if [[ -z "${filenames[$filename]:-}" ]]; then
              echo "Missing installer: $filename" >&2
              exit 1
            fi
          done
          channel=alpha
          if [[ "$TAG" == *-beta.* ]]; then channel=beta; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --prerelease --title "RuntimeHell $TAG ($channel)" --notes-file ".github/$channel-release-notes.md"
          fi
          # Hash the actual installers, with portable basename-only entries.
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > SHA256SUMS.txt
          for asset in "${assets[@]}"; do
            gh release upload "$TAG" "$asset" --clobber
          done
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease
