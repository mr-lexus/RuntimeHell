appId: com.runtimehell.app
productName: RuntimeHell
directories:
  output: dist-release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - out/main/templates/**
  - out/main/mitata/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RuntimeHell
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
linux:
  icon: build/icon.png
  category: Development
  maintainer: RuntimeHell contributors <runtimehell@users.noreply.github.com>
  synopsis: Multi-runtime JavaScript and TypeScript playground
  description: RuntimeHell runs JavaScript and TypeScript across multiple runtimes and analyzes engine internals.
  target:
    - AppImage
    - deb
publish:
  provider: github
  owner: mr-lexus
  repo: RuntimeHell
  releaseType: draft
