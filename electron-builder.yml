appId: com.runtimehell.app
productName: RuntimeHell
directories:
  output: dist-release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RuntimeHell
publish:
  provider: generic
  url: https://updates.runtimehell.example/latest
